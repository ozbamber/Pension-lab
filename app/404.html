    p { margin: 0 auto 28px; max-width: 34rem; color: #50635d; font-size: 1.05rem; line-height: 1.65; }
    a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 24px; border-radius: 999px; color: #fff; background: #176b5a; font-weight: 700; text-decoration: none; }

  <main>
